<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var path = location.pathname || "/";
      var hash = location.hash || "";
      if (path.indexOf("/app") === 0 || path.indexOf("/site") === 0 || path.indexOf("/assets/site") === 0) return;
      if (path !== "/" && path !== "/index.html") return;
      if (hash && hash !== "#" && hash !== "#/") return;
      location.replace("/site/index.html");
    })();
  </script>
  <base href="./">
  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, display-capture=*, fullscreen=*" />
  <meta content="Sunrise Coaching Khargone — coaching institute for PAT exams." name="description" />
  <link href="assets/brand/logo.png" rel="icon" type="image/png">
  <title>Sunrise Coaching Khargone</title>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<app-root>
  <div class="fade show" style="text-align: center; padding-top: calc(100vh / 2); height: 100vh">
    <i class="spinner-grow spinner-grow-sm"></i>
    <span class="m-1">Loading...</span>
  </div>
</app-root>
</body>
</html>
